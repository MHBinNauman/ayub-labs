<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Abstract laboratory illustration">
  <!--
    Placeholder hero art for Ayyub Labs & Clinics. Brand colours only:
    navy #27477D, logo blue #0A58A8, logo red #E81C24, white.
    Replace with a real photo of the lab once the client supplies one.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A58A8"/>
      <stop offset="1" stop-color="#27477D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#glow)"/>

  <!-- Molecule network -->
  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5" fill="none">
    <path d="M40 70 L95 40 L150 70 L150 130 L95 160 L40 130 Z"/>
    <path d="M150 70 L205 40 L260 70"/>
    <path d="M95 160 L95 215 L150 245"/>
    <path d="M300 380 L345 355 L390 380 L390 430 L345 455 L300 430 Z"/>
    <path d="M300 380 L255 355"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.55">
    <circle cx="40" cy="70" r="4"/><circle cx="95" cy="40" r="4"/><circle cx="150" cy="70" r="5"/>
    <circle cx="150" cy="130" r="4"/><circle cx="95" cy="160" r="5"/><circle cx="40" cy="130" r="4"/>
    <circle cx="205" cy="40" r="4"/><circle cx="260" cy="70" r="5"/><circle cx="95" cy="215" r="4"/>
    <circle cx="150" cy="245" r="4"/><circle cx="300" cy="380" r="5"/><circle cx="345" cy="355" r="4"/>
    <circle cx="390" cy="380" r="4"/><circle cx="345" cy="455" r="4"/><circle cx="255" cy="355" r="4"/>
  </g>

  <!-- DNA helix -->
  <g stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round">
    <path stroke-opacity="0.45" d="M330 40 C 290 80, 290 110, 330 150 S 370 220, 330 260 S 290 330, 330 370"/>
    <path stroke-opacity="0.45" d="M330 40 C 370 80, 370 110, 330 150 S 290 220, 330 260 S 370 330, 330 370"/>
    <g stroke-opacity="0.3" stroke-width="1.5">
      <path d="M306 75 H354"/><path d="M302 110 H358"/><path d="M314 190 H346"/>
      <path d="M304 222 H356"/><path d="M308 300 H352"/><path d="M302 332 H358"/>
    </g>
  </g>

  <!-- Flask -->
  <g transform="translate(118 200)">
    <path d="M52 0 H112 M62 0 V70 L0 190 Q-8 210 14 214 H150 Q172 210 164 190 L102 70 V0"
          fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3" stroke-linejoin="round"/>
    <path d="M30 132 H134 L160 186 Q166 202 150 204 H14 Q-2 202 4 186 Z" fill="url(#liquid)"/>
    <circle cx="62" cy="168" r="7" fill="#FFFFFF" fill-opacity="0.6"/>
    <circle cx="96" cy="150" r="4" fill="#FFFFFF" fill-opacity="0.6"/>
    <circle cx="110" cy="178" r="5" fill="#FFFFFF" fill-opacity="0.5"/>
  </g>

  <!-- Test tubes -->
  <g transform="translate(46 300)" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2.5" fill="none">
    <rect x="0" y="0" width="22" height="120" rx="11"/>
    <rect x="34" y="20" width="22" height="100" rx="11"/>
    <path d="M-10 70 H66" stroke-opacity="0.5"/>
  </g>
  <rect x="48.5" y="370" width="17" height="47" rx="8.5" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="82.5" y="380" width="17" height="37" rx="8.5" fill="#E81C24" fill-opacity="0.85"/>

  <!-- Drop -->
  <path d="M200 120 C 200 120, 178 148, 178 162 A 22 22 0 0 0 222 162 C 222 148, 200 120, 200 120 Z"
        fill="#E81C24"/>
  <path d="M190 160 A 10 10 0 0 0 198 172" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
